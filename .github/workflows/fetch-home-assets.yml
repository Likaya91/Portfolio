name: Fetch homepage assets

on:
  push:
    branches: ["home-real-html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-home-assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-real-html
      - name: Download homepage assets from Figma
        run: |
          mkdir -p assets/home
          curl -L --fail --retry 3 -o assets/home/portrait-desktop.png "https://www.figma.com/api/mcp/asset/390883fd-b616-4e6d-9a96-9ca95b6806c5.png"
          curl -L --fail --retry 3 -o assets/home/case1-desktop.png "https://www.figma.com/api/mcp/asset/59beeaff-a1c3-4cf4-8a77-8dee32d48661.png"
          curl -L --fail --retry 3 -o assets/home/case2-desktop.png "https://www.figma.com/api/mcp/asset/7aa4e815-5ce2-4808-9667-3b6bce46490e.png"
          curl -L --fail --retry 3 -o assets/home/case3-desktop.png "https://www.figma.com/api/mcp/asset/b5f3d696-108b-43d2-9916-448b58f4aac1.png"
          curl -L --fail --retry 3 -o assets/home/portrait-mobile.png "https://www.figma.com/api/mcp/asset/f41597b0-ba8d-402a-a38b-644c23659fa9.png"
          curl -L --fail --retry 3 -o assets/home/case1-mobile.png "https://www.figma.com/api/mcp/asset/3182c6fb-04ae-41b4-a9d9-add17185d4c1.png"
          curl -L --fail --retry 3 -o assets/home/case2-mobile.png "https://www.figma.com/api/mcp/asset/504f9025-7355-4d76-872b-f77c73248d21.png"
          curl -L --fail --retry 3 -o assets/home/case3-mobile.png "https://www.figma.com/api/mcp/asset/492415e1-6651-463b-87dc-41547f42cadc.png"
          curl -L --fail --retry 3 -o assets/home/arrow-ext.svg "https://www.figma.com/api/mcp/asset/c62e66f5-1281-41eb-bc8b-78fc08d977a9.svg"
          test -s assets/home/portrait-desktop.png
          test -s assets/home/case1-desktop.png
          test -s assets/home/case2-desktop.png
          test -s assets/home/case3-desktop.png
          test -s assets/home/portrait-mobile.png
          test -s assets/home/case1-mobile.png
          test -s assets/home/case2-mobile.png
          test -s assets/home/case3-mobile.png
          test -s assets/home/arrow-ext.svg
      - name: Commit homepage assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home
          git diff --cached --quiet || git commit -m "Add responsive homepage assets"
          git push origin home-real-html
