name: Fetch Satou clean mobile requirement asset

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  asset:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clean requirements visual
        run: |
          mkdir -p assets/satou
          curl -L --fail --retry 3 -o assets/satou/requirements-mobile-clean.png "https://www.figma.com/api/mcp/asset/9a4ea1b0-4972-4ef0-a55e-6f2c5d3475cb.png"
          test -s assets/satou/requirements-mobile-clean.png
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/satou/requirements-mobile-clean.png
          git diff --cached --quiet || git commit -m "Add clean Satou mobile requirements visual"
          git push origin main
