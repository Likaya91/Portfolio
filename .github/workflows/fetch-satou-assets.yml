name: Fetch Satou assets

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Satou assets
        run: |
          mkdir -p assets/satou

          curl -L --fail --retry 3 -o assets/satou/cover-desktop.png "https://www.figma.com/api/mcp/asset/de825dc0-6c09-498d-a618-4bded3d84436.png"
          curl -L --fail --retry 3 -o assets/satou/cover-mobile.png "https://www.figma.com/api/mcp/asset/31aec7a5-0a76-49e3-aae5-2e328768c4a7.png"

          curl -L --fail --retry 3 -o assets/satou/requirements-desktop.png "https://www.figma.com/api/mcp/asset/064e9158-9eec-49c9-9c07-ffa0a9d9972b.png"
          curl -L --fail --retry 3 -o assets/satou/requirements-mobile.png "https://www.figma.com/api/mcp/asset/113b7eb8-6bc1-41f7-9823-242d1d45e640.png"

          curl -L --fail --retry 3 -o assets/satou/persona-desktop.png "https://www.figma.com/api/mcp/asset/347b74b9-87cd-4c12-be12-79b21fcfd1a6.png"
          curl -L --fail --retry 3 -o assets/satou/persona-mobile.png "https://www.figma.com/api/mcp/asset/ca693d90-a28c-47bf-910e-b1f25dd411f4.png"

          curl -L --fail --retry 3 -o assets/satou/jtbd-desktop.png "https://www.figma.com/api/mcp/asset/55b55a1b-95c8-4e46-8de8-42ebbe65a20b.png"
          curl -L --fail --retry 3 -o assets/satou/jtbd-mobile.png "https://www.figma.com/api/mcp/asset/431cb8d0-2a50-4c3d-8ca5-963222afc643.png"

          curl -L --fail --retry 3 -o assets/satou/competitors-desktop.png "https://www.figma.com/api/mcp/asset/6cf68a94-c0f5-4b11-85d8-948176cacd90.png"
          curl -L --fail --retry 3 -o assets/satou/competitors-mobile.png "https://www.figma.com/api/mcp/asset/39df2f5d-25be-4470-b3b3-4a8cb91d2b6b.png"

          curl -L --fail --retry 3 -o assets/satou/userflow-desktop.png "https://www.figma.com/api/mcp/asset/fc32bb53-7a6b-4fcf-82f2-16d41f1aedde.png"
          curl -L --fail --retry 3 -o assets/satou/userflow-mobile.png "https://www.figma.com/api/mcp/asset/c8f9e6ec-740e-4746-884b-963e15e35682.png"

          curl -L --fail --retry 3 -o assets/satou/mockup-desktop.png "https://www.figma.com/api/mcp/asset/5f2916d5-12ff-4d3f-8ce3-e62807c14539.png"
          curl -L --fail --retry 3 -o assets/satou/mockup-desktop-mobile.png "https://www.figma.com/api/mcp/asset/96be2da3-1542-446f-bd33-8980245803cb.png"

          curl -L --fail --retry 3 -o assets/satou/mockup-mobile.png "https://www.figma.com/api/mcp/asset/97bc0d7d-4da8-4f6b-90c5-887ddb9d85e2.png"
          curl -L --fail --retry 3 -o assets/satou/mockup-mobile-mobile.png "https://www.figma.com/api/mcp/asset/e7fbdff1-3de4-4dcc-b9e4-16f1849d2081.png"

          find assets/satou -type f -size 0 -print -quit | grep -q . && exit 1 || true

      - name: Commit Satou assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/satou
          git diff --cached --quiet || git commit -m "Add responsive Satou assets"
          git push origin main
