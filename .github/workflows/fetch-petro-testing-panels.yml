name: Fetch PETROGLIF testing panels

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download responsive testing panels
        run: |
          mkdir -p assets/petroglif
          curl -L --fail --retry 3 -o assets/petroglif/testing-a-desktop.png "https://www.figma.com/api/mcp/asset/e8d3e6cb-3bf5-4369-91d9-a08beb39e7df.png"
          curl -L --fail --retry 3 -o assets/petroglif/testing-b-desktop.png "https://www.figma.com/api/mcp/asset/efa94c7d-f00d-46f3-9e3e-d86e30d7d18a.png"
          curl -L --fail --retry 3 -o assets/petroglif/testing-c-desktop.png "https://www.figma.com/api/mcp/asset/869d24d4-85bc-48a8-8d3b-2bf5b5c4c976.png"

          curl -L --fail --retry 3 -o assets/petroglif/testing-a-mobile.png "https://www.figma.com/api/mcp/asset/d01b8bba-48ae-4c60-b253-f0db6259841c.png"
          curl -L --fail --retry 3 -o assets/petroglif/testing-b-mobile.png "https://www.figma.com/api/mcp/asset/2aafc0e3-210a-41fe-ba72-bf0fad9cf17d.png"
          curl -L --fail --retry 3 -o assets/petroglif/testing-c-mobile.png "https://www.figma.com/api/mcp/asset/ed514c31-5dea-443a-99a4-a6a7b93d4e5f.png"

          for f in assets/petroglif/testing-a-desktop.png assets/petroglif/testing-b-desktop.png assets/petroglif/testing-c-desktop.png assets/petroglif/testing-a-mobile.png assets/petroglif/testing-b-mobile.png assets/petroglif/testing-c-mobile.png; do
            test -s "$f"
          done

      - name: Commit responsive testing panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/petroglif
          git diff --cached --quiet || git commit -m "Add PETROGLIF responsive testing panels"
          git push origin main
