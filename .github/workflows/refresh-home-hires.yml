name: Refresh high-resolution homepage assets

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 3x Figma exports
        run: |
          mkdir -p assets/home
          curl -L --fail --retry 3 -o assets/home/portrait-desktop.png "https://www.figma.com/api/mcp/asset/122baa66-dfec-45eb-8941-bfdad4f7b5a8.png"
          curl -L --fail --retry 3 -o assets/home/case1-desktop.png "https://www.figma.com/api/mcp/asset/5c43dc18-f8c0-4c91-a3c3-9145036021a3.png"
          curl -L --fail --retry 3 -o assets/home/case2-desktop.png "https://www.figma.com/api/mcp/asset/42ef72c3-8c01-49e0-b59d-0b8989539494.png"
          curl -L --fail --retry 3 -o assets/home/case3-desktop.png "https://www.figma.com/api/mcp/asset/3e6b080f-d3e4-4270-bda5-d3123bc14f14.png"

          curl -L --fail --retry 3 -o assets/home/portrait-mobile.png "https://www.figma.com/api/mcp/asset/cc9cd276-d38f-45d6-928c-5ee8619f89ea.png"
          curl -L --fail --retry 3 -o assets/home/case1-mobile.png "https://www.figma.com/api/mcp/asset/dcb16d9b-bc16-4cb3-811c-e9d4d3304bd7.png"
          curl -L --fail --retry 3 -o assets/home/case2-mobile.png "https://www.figma.com/api/mcp/asset/c4bf53ed-b605-4e5b-92c7-13d8ba4be46f.png"
          curl -L --fail --retry 3 -o assets/home/case3-mobile.png "https://www.figma.com/api/mcp/asset/ee81ba74-9757-4608-a38d-4a4e7d5e7739.png"

          for f in assets/home/portrait-desktop.png assets/home/case1-desktop.png assets/home/case2-desktop.png assets/home/case3-desktop.png assets/home/portrait-mobile.png assets/home/case1-mobile.png assets/home/case2-mobile.png assets/home/case3-mobile.png; do
            test -s "$f"
          done

      - name: Commit high-resolution assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home
          git diff --cached --quiet || git commit -m "Upgrade homepage images to 3x"
          git push origin main
