name: Fetch Psychologist assets

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Psychologist assets
        run: |
          mkdir -p assets/psychologist

          curl -L --fail --retry 3 -o assets/psychologist/cover-bg-desktop.png "https://www.figma.com/api/mcp/asset/330a56ee-32a7-4d60-a757-940753dd8d5a.png"
          curl -L --fail --retry 3 -o assets/psychologist/cover-bg-mobile.png "https://www.figma.com/api/mcp/asset/e10043bf-c195-4450-a201-7f32c90b43f0.png"

          curl -L --fail --retry 3 -o assets/psychologist/cover-header-desktop.png "https://www.figma.com/api/mcp/asset/ef10e817-a71e-4fa0-a377-e3107f02e500.png"
          curl -L --fail --retry 3 -o assets/psychologist/cover-header-mobile.png "https://www.figma.com/api/mcp/asset/617704b6-9209-4c78-94d7-dc06a89f6a8d.png"

          curl -L --fail --retry 3 -o assets/psychologist/competitors-desktop.png "https://www.figma.com/api/mcp/asset/7a4eca79-ee23-4286-9ead-190e4a12b708.png"
          curl -L --fail --retry 3 -o assets/psychologist/competitors-mobile.png "https://www.figma.com/api/mcp/asset/805344ca-38aa-48cb-a7d3-0a00910dce7b.png"

          curl -L --fail --retry 3 -o assets/psychologist/final-static-desktop.png "https://www.figma.com/api/mcp/asset/9b1c1a25-523a-4a8f-86a1-81eeb4c3929d.png"
          curl -L --fail --retry 3 -o assets/psychologist/final-static-mobile.png "https://www.figma.com/api/mcp/asset/37ec8c0b-8c8a-48d7-9754-bc179d637d36.png"

          for f in assets/psychologist/*.png; do test -s "$f"; done

      - name: Commit Psychologist assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/psychologist
          git diff --cached --quiet || git commit -m "Add Psychologist responsive assets"
          git push origin main
