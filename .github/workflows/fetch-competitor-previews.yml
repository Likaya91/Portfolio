name: Fetch competitor previews

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download competitor preview images
        run: |
          mkdir -p assets/petroglif
          curl -L --fail --retry 3 -o assets/petroglif/competitor-cosmorelax.png "https://www.figma.com/api/mcp/asset/ff6555e1-ddac-4fca-9b18-4a20d5e51e9a.png"
          curl -L --fail --retry 3 -o assets/petroglif/competitor-lakartina.png "https://www.figma.com/api/mcp/asset/f0d73174-7efc-4940-b2bd-295149ddcf4e.png"
          curl -L --fail --retry 3 -o assets/petroglif/competitor-artsten.png "https://www.figma.com/api/mcp/asset/600e3286-506f-4ed2-909b-5aad96292418.png"
          test -s assets/petroglif/competitor-cosmorelax.png
          test -s assets/petroglif/competitor-lakartina.png
          test -s assets/petroglif/competitor-artsten.png
      - name: Commit competitor preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/petroglif
          git diff --cached --quiet || git commit -m "Add competitor preview images"
          git push origin main
